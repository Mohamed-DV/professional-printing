<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توصلنا بالطلب ديالك | Professional Printing</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=__V__">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=__V__">
<link rel="preload" href="/assets/fonts/alexandria-arabic.woff2?v=__V__" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Alexandria";src:url(/assets/fonts/alexandria-arabic.woff2?v=__V__) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Alexandria";src:url(/assets/fonts/alexandria-latin.woff2?v=__V__) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+2013-2022}
:root{--gold:#F4BE1E;--gold-hi:#FFF1A6;--cream:#F6EFDD;--muted:#B5A88B;--line:rgba(244,190,30,.24);
  --foil:linear-gradient(180deg,#FFF1A6 0%,#F7CC3C 38%,#E2A615 64%,#A26C08 100%);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(80% 50% at 50% 0%,rgba(244,190,30,.10),transparent 70%),#000;color:var(--cream);
  font-family:"Alexandria",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:460px;text-align:center}
img{display:block;margin:0 auto 18px;width:84px;height:auto}
.check{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--foil);color:#1A1203}
.check svg{width:28px;height:28px}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.3}
p{margin:8px 0 0;color:#DCCFAE;font-size:15px}
.num{margin:22px 0 0;padding:14px;border:1px dashed rgba(244,190,30,.5);border-radius:3px;background:#0E0A04}
.num span{display:block;font-size:13px;color:var(--muted)}
.num b{display:block;margin-top:2px;font-size:24px;font-weight:800;letter-spacing:.04em;direction:ltr;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
dl{margin:18px 0 0;padding:16px 18px;display:grid;gap:8px;text-align:start;background:#17110A;border:1px solid var(--line);border-radius:3px}
dl div{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
dt{color:var(--muted)} dd{margin:0;font-weight:600}
.total{padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.total dd{color:var(--gold-hi);font-weight:800;font-size:17px}
a{display:inline-block;margin-top:22px;color:var(--gold-hi);font-weight:700;text-underline-offset:4px}
a:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
</style>
<!--pixel:start--><meta name="pp-pixel" content="__META_PIXEL_ID__"><script src="/assets/js/pixel.js?v=__V__" async></script><!--pixel:end-->
</head>
<body>
<main>
  <img src="/assets/img/logo-200.webp?v=__V__" width="191" height="200" alt="Professional Printing">
  <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>توصلنا بالطلب ديالك!</h1>
  <p id="next">غادي نتاصلو بيك فالهاتف فأقرب وقت باش نأكدو معاك الطلب والتصميم.</p>

  <div class="num" id="num" hidden><span>رقم الطلب</span><b id="order-number"></b></div>

  <dl>
    <div><dt>بطاقات زيارة</dt><dd>1000 بطاقة</dd></div>
    <div><dt>الطباعة</dt><dd>على الوجهين (Recto Verso)</dd></div>
    <div><dt>التصميم الاحترافي</dt><dd>مجاني</dd></div>
    <div class="total"><dt>المجموع</dt><dd>290 درهم</dd></div>
  </dl>

  <a href="/">رجع للصفحة الرئيسية</a>
</main>
<script src="/assets/js/merci.js?v=__V__" defer></script>
</body>
</html>
